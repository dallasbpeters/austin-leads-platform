<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"scenes","type":"string","label":"Scenes (JSON)","default":"[{\"type\":\"lights\",\"duration\":6,\"eyebrow\":\"Central Texas\",\"headline\":\"Your roofline. Lit.\",\"sub\":\"No ladder. No tangled box of lights.\",\"bulbColor\":\"warm-white\"},{\"type\":\"signoff\",\"duration\":4,\"headline\":\"Free estimate · No pressure\",\"sub\":\"(512) 775-0561\"}]"},
    {"id":"totalDuration","type":"number","label":"Total seconds","default":10,"min":2,"max":90,"step":0.5}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'Switzer';
        src: url('assets/fonts/Switzer-Variable.woff2') format('woff2');
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: 'Bespoke Serif';
        src: url('assets/fonts/BespokeSerif-Variable.woff2') format('woff2');
        font-weight: 100 900;
        font-display: block;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #05080f;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: 'Switzer', system-ui, sans-serif;
        color: #f6f4ef;
        overflow: hidden;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      .scene {
        position: absolute;
        inset: 0;
        opacity: 0;
        overflow: hidden;
      }

      /* ── Night air ─────────────────────────────────────────────────────
         Sky, a low warm haze (street light off frame), and cold rim light. */

      .sky {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(90% 46% at 50% 96%, rgba(255, 176, 92, 0.16) 0%, rgba(255, 176, 92, 0) 66%),
          radial-gradient(120% 62% at 50% 4%, #16384a 0%, rgba(9, 20, 34, 0) 58%),
          linear-gradient(180deg, #0a1b2c 0%, #071322 42%, #050a12 74%, #04070d 100%);
      }

      /* Snow in three depth layers: far grains, mid flakes, near bokeh. */
      .flake {
        position: absolute;
        display: block;
        border-radius: 50%;
        background: #ffffff;
      }

      .flake--far {
        filter: blur(0.4px);
      }

      .flake--mid {
        filter: blur(1.4px);
      }

      .flake--near {
        filter: blur(7px);
      }

      /* Film finishing: vignette, grain, and a slow warm leak across the top. */
      .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(78% 62% at 50% 46%, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, 0.62) 100%);
      }

      .grain {
        position: absolute;
        inset: -50%;
        width: 200%;
        height: 200%;
        pointer-events: none;
        opacity: 0.11;
        mix-blend-mode: overlay;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        animation: grain-shift 0.5s steps(1) infinite;
      }

      @keyframes grain-shift {
        0%,
        100% {
          transform: translate(0, 0);
        }
        20% {
          transform: translate(-6%, 4%);
        }
        40% {
          transform: translate(5%, -7%);
        }
        60% {
          transform: translate(-4%, -3%);
        }
        80% {
          transform: translate(7%, 5%);
        }
      }

      .leak {
        position: absolute;
        inset: -20% -30%;
        pointer-events: none;
        opacity: 0.4;
        mix-blend-mode: screen;
        background: radial-gradient(
          52% 34% at 18% 6%,
          rgba(255, 168, 92, 0.42) 0%,
          rgba(255, 168, 92, 0) 70%
        );
      }

      /* The light burst: a warm bloom that flashes up at every scene change and
         opens the reel. It sits above everything, so a cut hides under it. */
      .burst {
        z-index: 40;
        position: absolute;
        inset: -10%;
        pointer-events: none;
        opacity: 0;
        mix-blend-mode: screen;
        background:
          radial-gradient(38% 22% at 50% 44%, rgba(255, 244, 214, 0.95) 0%, rgba(255, 244, 214, 0) 70%),
          radial-gradient(70% 46% at 50% 50%, rgba(255, 190, 110, 0.85) 0%, rgba(255, 190, 110, 0) 72%);
      }

      /* ── Type ──────────────────────────────────────────────────────────
         One gold eyebrow with hairlines, a serif headline whose words whip in
         one after another, one supporting line that wipes up. */

      /* Type sits above the vignette and grain, so nothing dulls the words. */
      .copy {
        z-index: 30;
        position: absolute;
        right: 96px;
        bottom: 300px;
        left: 96px;
        text-align: center;
      }

      .copy--center {
        top: 50%;
        bottom: auto;
        transform: translateY(-50%);
      }

      .copy--top {
        top: 190px;
        bottom: auto;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 22px;
        color: #f0c987;
        font-size: 27px;
        font-weight: 500;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        opacity: 0;
      }

      .eyebrow::before,
      .eyebrow::after {
        content: '';
        width: 88px;
        height: 1px;
        background: linear-gradient(90deg, rgba(240, 201, 135, 0) 0%, rgba(240, 201, 135, 0.85) 100%);
      }

      .eyebrow::after {
        background: linear-gradient(90deg, rgba(240, 201, 135, 0.85) 0%, rgba(240, 201, 135, 0) 100%);
      }

      .headline {
        margin-top: 40px;
        font-family: 'Bespoke Serif', Georgia, serif;
        font-size: 112px;
        line-height: 1.06;
        font-weight: 400;
        letter-spacing: -0.022em;
      }

      .headline-line {
        display: block;
        /* headroom for the whip: words start 80px low and must not clip */
        padding: 0.04em 0 0.1em;
      }

      /* Each word arrives on its own: hidden until its beat, then whips up. */
      .word {
        display: inline-block;
        opacity: 0;
        will-change: transform;
        margin: 0 0.12em;
      }

      /* A masked box: the line wipes up inside it instead of popping. */
      .line-mask {
        display: block;
        overflow: hidden;
        /* room for descenders (g, p, y) inside the wipe mask */
        padding-bottom: 0.12em;
        margin-bottom: -0.12em;
      }

      .line {
        display: block;
        transform: translateY(105%);
      }

      .sub {
        margin: 32px auto 0;
        max-width: 780px;
        font-size: 40px;
        line-height: 1.34;
        font-weight: 400;
        color: rgba(246, 244, 239, 0.74);
      }

      /* The price counts up, then a gold sheen sweeps through the figures.
         The gradient paints only inside the text box, and this serif's figures
         reach above and below it — so the box gets real headroom, or the tops
         and tails of the numbers are cut off. */
      .price-wrap {
        position: relative;
        margin-top: 18px;
      }

      .price {
        position: relative;
        z-index: 2;
        display: inline-block;
        padding: 0.1em 0.06em 0.16em;
        font-family: 'Bespoke Serif', Georgia, serif;
        font-size: 204px;
        line-height: 1.12;
        white-space: nowrap;
        font-weight: 500;
        letter-spacing: -0.045em;
        font-variant-numeric: tabular-nums;
        background: linear-gradient(100deg, #c98f3f 0%, #f0c987 30%, #fff3d6 46%, #f0c987 62%, #c98f3f 100%);
        background-size: 260% 100%;
        background-position: 130% 0;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        opacity: 0;
      }

      /* Shine dots fly out from behind the price when it lands. */
      .sparks {
        position: absolute;
        z-index: 1;
        left: 50%;
        top: 55%;
        width: 0;
        height: 0;
      }

      .spark {
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 50%;
        opacity: 0;
        will-change: transform, opacity;
      }

      /* ── Photo scene ──────────────────────────────────────────────── */

      .photo {
        position: absolute;
        inset: -8%;
        background-size: cover;
        background-position: center;
        filter: saturate(1.06) contrast(1.06) brightness(0.92);
      }

      .photo-grade {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(70% 44% at 50% 30%, rgba(255, 190, 120, 0.12) 0%, rgba(255, 190, 120, 0) 70%),
          linear-gradient(
            180deg,
            rgba(5, 10, 18, 0.72) 0%,
            rgba(5, 10, 18, 0.06) 34%,
            rgba(5, 10, 18, 0.9) 100%
          );
      }

      /* A warm bar of light that sweeps across the photo as the headline lands. */
      .sweep {
        position: absolute;
        top: -20%;
        left: 0;
        width: 340px;
        height: 140%;
        opacity: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        transform: translateX(-600px) skewX(-16deg);
        background: linear-gradient(
          90deg,
          rgba(255, 214, 150, 0) 0%,
          rgba(255, 214, 150, 0.55) 50%,
          rgba(255, 214, 150, 0) 100%
        );
      }

      /* ── Illustrated night scene ──────────────────────────────────── */

      .scene-art {
        position: absolute;
        inset: 0;
        transform-origin: 50% 62%;
      }

      .bulb {
        position: absolute;
        width: 44px;
        transform-origin: 50% 6%;
        opacity: 0;
      }

      .bulb-bloom {
        position: absolute;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        opacity: 0;
        mix-blend-mode: screen;
      }

      /* ── Sign-off ─────────────────────────────────────────────────── */

      .signoff {
        z-index: 30;
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 96px;
        text-align: center;
      }

      .signoff-logo {
        width: 430px;
        opacity: 0;
        filter: drop-shadow(0 20px 60px rgba(0, 0, 0, 0.6));
      }

      .phone {
        margin-top: 52px;
        font-size: 78px;
        font-weight: 600;
        letter-spacing: -0.015em;
        opacity: 0;
      }

      .rule {
        width: 420px;
        height: 1px;
        margin: 34px auto 0;
        transform: scaleX(0);
        background: linear-gradient(
          90deg,
          rgba(240, 201, 135, 0) 0%,
          rgba(240, 201, 135, 0.9) 50%,
          rgba(240, 201, 135, 0) 100%
        );
      }

      .cta {
        margin-top: 26px;
        font-size: 34px;
        letter-spacing: 0.06em;
        color: rgba(246, 244, 239, 0.7);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
    >
      <div class="clip" id="stage" data-start="0" data-duration="10" data-track-index="0">
        <div class="sky" id="sky"></div>
        <div id="snow"></div>
        <div id="scenes"></div>
        <!-- Finishing layers: translucent by design, so the checker is told the overlap is intentional. -->
        <div class="leak" id="leak"></div>
        <div class="vignette" id="vignette"></div>
        <div class="grain" id="grain"></div>
        <!-- Words live above the film finish, so vignette and grain never dull them. -->
        <div id="copy-layer"></div>
        <!-- The light burst covers every cut. -->
        <div class="burst" id="burst"></div>
      </div>
    </div>

    <script>
      /*
       * Scene engine.
       *
       * The builder at /reels sends a list of scenes; each one becomes DOM plus
       * a slice of the timeline. Art direction rules that keep these postable:
       * photography leads where there is a photo, words arrive one at a time
       * and never fade in, cuts hide under a warm light burst, and every frame
       * carries the same night grade — haze, vignette, grain.
       *
       * The renderer (services/reel-renderer/audio.mjs) places sound effects
       * against the BEATS table below. Change a beat here and there together.
       *
       * Deterministic only: no Math.random, no Date.now, no endless repeats.
       */

      const { scenes: scenesRaw } = window.__hyperframes.getVariables()

      const DEFAULT_SCENES = [
        {
          type: 'lights',
          duration: 6,
          eyebrow: 'Central Texas',
          headline: 'Your roofline. Lit.',
          sub: 'No ladder. No tangled box of lights.',
          bulbColor: 'warm-white',
        },
        { type: 'signoff', duration: 4, headline: 'Free estimate · No pressure', sub: '(512) 775-0561' },
      ]

      /* When things land inside a scene, in seconds from its start. */
      const BEATS = {
        eyebrow: 0.25,
        headline: 0.5,
        wordStep: 0.14,
        price: 0.9,
        priceCount: 0.9,
        lightsOn: 0.7,
        signoffLogo: 0.2,
        signoffPhone: 0.7,
        burst: 0.45,
        hook: 1.2,
      }

      const F = 1 / 30

      const parseScenes = (raw) => {
        if (Array.isArray(raw)) {
          return raw
        }
        try {
          const parsed = JSON.parse(String(raw || ''))
          return Array.isArray(parsed) && parsed.length ? parsed : DEFAULT_SCENES
        } catch {
          return DEFAULT_SCENES
        }
      }

      const scenes = parseScenes(scenesRaw)
      const sceneDuration = (scene) => Math.max(2, Number(scene.duration) || 4)
      const totalDuration = scenes.reduce((sum, scene) => sum + sceneDuration(scene), 0)

      const seeded = (seed) => {
        let state = Math.floor(seed) % 2147483647 || 1
        return () => {
          state = (state * 16807) % 2147483647
          return (state - 1) / 2147483646
        }
      }

      /* A pure hash: the same index always gives the same number. */
      const prand = (n) => {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453
        return x - Math.floor(x)
      }

      const el = (tag, className, parent) => {
        const node = document.createElement(tag)
        if (className) {
          node.className = className
        }
        if (parent) {
          parent.append(node)
        }
        return node
      }

      const tl = gsap.timeline({ paused: true })
      const stage = document.getElementById('scenes')
      const copyLayer = document.getElementById('copy-layer')

      // ── Snowfall, three depths ───────────────────────────────────────

      const snowRandom = seeded(20261225)
      const snow = document.getElementById('snow')
      const LAYERS = [
        { name: 'far', count: 48, size: [3, 6], opacity: [0.25, 0.5], speed: [0.55, 0.75] },
        { name: 'mid', count: 26, size: [8, 14], opacity: [0.35, 0.6], speed: [0.8, 1] },
        { name: 'near', count: 9, size: [26, 46], opacity: [0.16, 0.3], speed: [1.15, 1.45] },
      ]

      for (const layer of LAYERS) {
        for (let index = 0; index < layer.count; index += 1) {
          const size = layer.size[0] + snowRandom() * (layer.size[1] - layer.size[0])
          const flake = el('span', `flake flake--${layer.name}`, snow)
          flake.style.width = `${size.toFixed(1)}px`
          flake.style.height = `${size.toFixed(1)}px`
          flake.style.left = `${(snowRandom() * 1080).toFixed(0)}px`
          flake.style.opacity = `${(layer.opacity[0] + snowRandom() * (layer.opacity[1] - layer.opacity[0])).toFixed(2)}`
          const speed = layer.speed[0] + snowRandom() * (layer.speed[1] - layer.speed[0])
          tl.fromTo(
            flake,
            { y: -300 - snowRandom() * 900 },
            { y: 2200, x: (snowRandom() - 0.5) * 160, duration: totalDuration / speed, ease: 'none' },
            0,
          )
        }
      }

      /* The leak drifts, so the finish never sits perfectly still. */
      tl.fromTo(
        '#leak',
        { xPercent: -4, opacity: 0.28 },
        { xPercent: 4, opacity: 0.46, duration: totalDuration, ease: 'sine.inOut' },
        0,
      )

      // ── Light burst ──────────────────────────────────────────────────

      /** A warm flash: up fast, clears slower. Covers a cut at `at`. */
      const burst = (at, peak = 0.95) => {
        tl.fromTo(
          '#burst',
          { opacity: 0, scale: 0.9 },
          { opacity: peak, scale: 1.02, duration: 0.16, ease: 'power2.in' },
          Math.max(0, at - 0.16),
        )
        tl.to('#burst', { opacity: 0, scale: 1.12, duration: 0.42, ease: 'power2.out' }, at)
      }

      // ── Copy ─────────────────────────────────────────────────────────

      /** Breaks a headline into lines that fit the 112px serif at 9:16: about 15 letters each. */
      const headlineLines = (text) => {
        const LINE_BUDGET = 15
        const parts = String(text || '')
          .split(/\s+/)
          .filter(Boolean)
        const lines = []
        let line = []
        let length = 0
        for (const word of parts) {
          const next = length + word.length + (line.length ? 1 : 0)
          if (line.length && next > LINE_BUDGET) {
            lines.push(line)
            line = []
            length = 0
          }
          line.push(word)
          length += word.length + (line.length > 1 ? 1 : 0)
        }
        if (line.length) {
          lines.push(line)
        }
        return lines
      }

      /** Reads "$1,250" as { prefix: "$", value: 1250, grouped: true, suffix: "" }, or null. */
      const parsePrice = (text) => {
        const match = String(text || '').match(/^([^\d]*)(\d[\d,]*)([^\d]*)$/)
        if (!match) {
          return null
        }
        const digits = match[2].replaceAll(',', '')
        if (!digits || digits.length > 7) {
          return null
        }
        return { prefix: match[1], value: Number(digits), grouped: match[2].includes(','), suffix: match[3] }
      }

      const formatPrice = (parsed, value) =>
        `${parsed.prefix}${parsed.grouped ? Math.round(value).toLocaleString('en-US') : Math.round(value)}${parsed.suffix}`

      const copyBlock = (scene, root, { center = false, top = false } = {}) => {
        const position = center ? 'copy copy--center' : top ? 'copy copy--top' : 'copy'
        const copy = el('div', position, root)
        const parts = { words: [] }

        if (scene.eyebrow) {
          parts.eyebrow = el('div', 'eyebrow', copy)
          parts.eyebrow.textContent = scene.eyebrow
        }
        if (scene.headline) {
          parts.headline = el('h1', 'headline', copy)
          for (const lineWords of headlineLines(scene.headline)) {
            const line = el('span', 'headline-line', parts.headline)
            for (const text of lineWords) {
              const word = el('span', 'word', line)
              word.textContent = text
              parts.words.push(word)
            }
          }
        }
        if (scene.price) {
          const wrap = el('div', 'price-wrap', copy)
          parts.sparks = el('div', 'sparks', wrap)
          parts.price = el('div', 'price', wrap)
          parts.priceText = String(scene.price)
          parts.price.textContent = parts.priceText
          /* Long prices ("$12,500") step down so they never run off the sides. */
          const length = parts.priceText.length
          if (length > 4) {
            parts.price.style.fontSize = `${Math.max(110, Math.round(204 * (4.6 / length)))}px`
          }
        }
        if (scene.sub) {
          parts.sub = el('p', 'sub', copy)
          const mask = el('span', 'line-mask', parts.sub)
          parts.subLine = el('span', 'line', mask)
          parts.subLine.textContent = scene.sub
        }
        return parts
      }

      /** Shine dots fly out from behind the price the moment it lands. */
      const sparkBurst = (field, at) => {
        const COUNT = 26
        const FLIGHT = 0.8
        const palette = ['#ffe6b0', '#f0c987', '#ffffff', '#ffd06b']
        const sparks = []
        for (let index = 0; index < COUNT; index += 1) {
          const dot = el('div', 'spark', field)
          const size = 5 + prand(index * 3 + 1) * 6
          dot.style.width = `${size.toFixed(1)}px`
          dot.style.height = `${size.toFixed(1)}px`
          dot.style.background = palette[index % palette.length]
          const angle = prand(index * 5 + 2) * Math.PI * 2
          const speed = 260 + prand(index * 7 + 3) * 420
          sparks.push({ dot, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed * 0.55 })
        }
        const drive = { T: 0 }
        tl.fromTo(
          drive,
          { T: 0 },
          {
            T: 1,
            duration: FLIGHT,
            ease: 'none',
            onUpdate: () => {
              const t = drive.T * FLIGHT
              const fade = Math.min(1, (1 - drive.T) / 0.35)
              for (const spark of sparks) {
                spark.dot.style.transform = `translate(${spark.vx * t}px, ${spark.vy * t + 40 * t * t}px)`
                spark.dot.style.opacity = String(drive.T === 0 ? 0 : fade)
              }
            },
          },
          at,
        )
      }

      /**
       * Brings a copy block on. Eyebrow softens in, headline words whip up one
       * after another, the price counts up and shines, the sub line wipes up.
       * Returns when the last word settles, so callers can time what follows.
       */
      const animateCopy = (parts, at) => {
        if (parts.eyebrow) {
          tl.fromTo(
            parts.eyebrow,
            { opacity: 0, y: 10, filter: 'blur(14px)' },
            { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.6, ease: 'power2.out' },
            at + BEATS.eyebrow,
          )
        }

        let cursor = at + BEATS.headline
        parts.words.forEach((word, index) => {
          const last = index === parts.words.length - 1
          const travel = index === 0 || last ? 84 : 52
          const duration = index === 0 || last ? 0.2 : 0.16
          tl.set(word, { opacity: 1, y: travel }, cursor)
          tl.to(word, { y: 0, duration, ease: 'power4.out' }, cursor)
          /* Each word starts a frame before the last one settles: a wave, not a queue. */
          cursor += Math.max(F * 2, BEATS.wordStep - index * F * 0.5)
        })
        const settled = parts.words.length ? cursor + 0.1 : at + BEATS.headline

        if (parts.price) {
          const priceAt = Math.max(at + BEATS.price, settled - 0.2)
          const parsed = parsePrice(parts.priceText)
          tl.fromTo(
            parts.price,
            { opacity: 0, y: 40, scale: 0.86 },
            { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'power3.out' },
            priceAt,
          )
          if (parsed && parsed.value > 0) {
            const counter = { value: 0 }
            tl.fromTo(
              counter,
              { value: 0 },
              {
                value: parsed.value,
                duration: BEATS.priceCount,
                ease: 'power2.out',
                onUpdate: () => {
                  parts.price.textContent = formatPrice(parsed, counter.value)
                },
              },
              priceAt,
            )
          }
          const landed = priceAt + (parsed ? BEATS.priceCount : 0.3)
          tl.fromTo(
            parts.price,
            { backgroundPosition: '130% 0' },
            { backgroundPosition: '-30% 0', duration: 1.1, ease: 'power2.inOut' },
            landed - 0.1,
          )
          tl.fromTo(
            parts.price,
            { scale: 1 },
            { scale: 1.04, duration: 0.18, ease: 'power2.out', yoyo: true, repeat: 1 },
            landed - 0.05,
          )
          sparkBurst(parts.sparks, landed - 0.05)
        }

        if (parts.subLine) {
          const subAt = parts.price ? Math.max(settled, at + BEATS.price + 0.7) : settled
          tl.to(parts.subLine, { y: '0%', duration: 0.7, ease: 'expo.out' }, subAt)
        }
        return settled
      }

      // ── Illustrated night scene ──────────────────────────────────────

      const MULTICOLOR = ['red', 'green', 'blue', 'amber', 'purple']
      const MULTICOLOR_GLOW = ['#ff3b30', '#27c86a', '#3b82f6', '#ffb000', '#d44df0']

      /*
       * A house at dusk: layered tree lines for depth, warm windows, and a
       * roofline of real C9 bulbs hung on a sagging run with a soft bloom.
       */
      const buildLights = (scene, root, at, duration) => {
        const color = scene.bulbColor || 'warm-white'
        const bulbSrc = (index) =>
          color === 'multicolor'
            ? `assets/brand/c9-${MULTICOLOR[index % MULTICOLOR.length]}.png`
            : `assets/brand/c9-${color}.png`
        const bloomOf = (index) =>
          color === 'multicolor'
            ? MULTICOLOR_GLOW[index % MULTICOLOR_GLOW.length]
            : color === 'bright-white'
              ? '#dbe9ff'
              : '#ffbe73'

        const art = el('div', 'scene-art', root)
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
        svg.setAttribute('viewBox', '0 0 1080 1920')
        svg.setAttribute('style', 'position:absolute;inset:0;width:100%;height:100%')
        svg.innerHTML = `
          <defs>
            <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#1b2b3a" />
              <stop offset="100%" stop-color="#0d1824" />
            </linearGradient>
            <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#22323f" />
              <stop offset="100%" stop-color="#14212c" />
            </linearGradient>
            <radialGradient id="window-glow">
              <stop offset="0%" stop-color="#ffcf8a" stop-opacity="0.95" />
              <stop offset="60%" stop-color="#ffb35c" stop-opacity="0.45" />
              <stop offset="100%" stop-color="#ffb35c" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#101d22" />
              <stop offset="100%" stop-color="#070d12" />
            </linearGradient>
          </defs>

          <!-- far tree line -->
          <g opacity="0.5" fill="#0b1720">
            <path d="M-20 1465 l70 -150 70 150z M90 1480 l56 -120 56 120z M190 1462 l64 -140 64 140z
                     M300 1486 l50 -108 50 108z M840 1470 l62 -134 62 134z M950 1484 l54 -116 54 116z
                     M1046 1462 l60 -132 60 132z" />
          </g>
          <!-- near tree line -->
          <g opacity="0.85" fill="#08131a">
            <path d="M-30 1530 l86 -196 86 196z M120 1548 l70 -160 70 160z M900 1540 l78 -178 78 178z
                     M1030 1556 l66 -150 66 150z" />
          </g>

          <!-- ground -->
          <rect x="0" y="1520" width="1080" height="400" fill="url(#ground)" />
          <ellipse cx="540" cy="1546" rx="470" ry="46" fill="#16252c" opacity="0.7" />

          <!-- house: main gable plus a lower wing, so it reads as a real elevation -->
          <rect x="250" y="1150" width="580" height="392" fill="url(#wall)" />
          <path d="M214 1158 L540 940 L866 1158 Z" fill="url(#roof)" />
          <rect x="760" y="1268" width="250" height="274" fill="#16242f" />
          <path d="M734 1276 L886 1176 L1038 1276 Z" fill="#1b2a36" />
          <rect x="624" y="1010" width="52" height="120" fill="#16242f" />

          <!-- warm windows and porch -->
          <circle cx="366" cy="1300" r="120" fill="url(#window-glow)" opacity="0.55" />
          <circle cx="714" cy="1300" r="120" fill="url(#window-glow)" opacity="0.5" />
          <rect x="316" y="1258" width="100" height="84" rx="6" fill="#f0bd78" opacity="0.88" />
          <rect x="664" y="1258" width="100" height="84" rx="6" fill="#f0bd78" opacity="0.8" />
          <rect x="508" y="1372" width="86" height="170" rx="5" fill="#0a131a" />
          <circle cx="551" cy="1372" r="74" fill="url(#window-glow)" opacity="0.45" />
          <rect x="860" y="1352" width="74" height="70" rx="5" fill="#f0bd78" opacity="0.55" />
        `
        art.append(svg)
        /* A slow push toward the roofline: the camera leans in as the lights come on. */
        tl.fromTo(art, { scale: 1, y: 0 }, { scale: 1.1, y: -30, duration: duration, ease: 'sine.inOut' }, at)

        /* Hang the run along the two rakes, with a little sag between clips. */
        const APEX = { x: 540, y: 946 }
        const EAVES = [
          { x: 216, y: 1158 },
          { x: 864, y: 1158 },
        ]
        const PER_SIDE = 13
        const wire = document.createElementNS('http://www.w3.org/2000/svg', 'path')
        wire.setAttribute('fill', 'none')
        wire.setAttribute('stroke', '#060d13')
        wire.setAttribute('stroke-width', '5')
        wire.setAttribute(
          'd',
          `M${EAVES[0].x} ${EAVES[0].y} L${APEX.x} ${APEX.y} L${EAVES[1].x} ${EAVES[1].y}`,
        )
        svg.append(wire)

        const allOn = at + BEATS.lightsOn + PER_SIDE * 0.075 + 0.6
        const twinkleWindow = at + duration - allOn - 0.4
        const twinkles = twinkleWindow > 1.2 ? Math.min(6, Math.floor(twinkleWindow / 0.7)) : 0

        for (let step = 0; step <= PER_SIDE; step += 1) {
          for (const [side, eave] of EAVES.entries()) {
            const t = step / PER_SIDE
            const x = APEX.x + (eave.x - APEX.x) * t
            /* sag: strongest between clips, none at the ends */
            const sag = Math.sin(t * Math.PI * PER_SIDE) * 3
            const y = APEX.y + (eave.y - APEX.y) * t + sag

            const bloom = el('div', 'bulb-bloom', art)
            bloom.style.left = `${x - 90}px`
            bloom.style.top = `${y - 66}px`
            bloom.style.background = `radial-gradient(circle, ${bloomOf(step)}8c 0%, ${bloomOf(step)}24 24%, rgba(0,0,0,0) 62%)`

            const bulb = el('img', 'bulb', art)
            bulb.src = bulbSrc(step)
            bulb.alt = ''
            bulb.style.left = `${x - 22}px`
            bulb.style.top = `${y - 4}px`

            /* Lights come on in a wave from the apex, with a tiny swing on the wire. */
            const lightAt = at + BEATS.lightsOn + step * 0.075
            tl.fromTo(
              bulb,
              { opacity: 0, scale: 0.72, rotation: side ? 6 : -6 },
              { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: 'power2.out' },
              lightAt,
            )
            tl.fromTo(
              bloom,
              { opacity: 0, scale: 0.7 },
              { opacity: 0.66, scale: 1, duration: 0.6, ease: 'power2.out' },
              lightAt,
            )

            /* Then a chase: every third bulb dips and comes back, on a shared beat. */
            const lane = (step + side) % 3
            for (let beat = 0; beat < twinkles; beat += 1) {
              const twinkleAt = allOn + beat * 0.7 + lane * 0.23
              tl.to(
                bloom,
                { opacity: 0.22, duration: 0.16, ease: 'power1.in', yoyo: true, repeat: 1 },
                twinkleAt,
              )
              tl.to(
                bulb,
                { opacity: 0.6, scale: 0.94, duration: 0.16, ease: 'power1.in', yoyo: true, repeat: 1 },
                twinkleAt,
              )
            }
          }
        }
      }

      /** Photography leads: a slow push-in, graded, a light sweep, with the copy over a scrim. */
      const buildPhoto = (scene, root, at, duration) => {
        const photo = el('div', 'photo', root)
        photo.style.backgroundImage = `url("${String(scene.photoUrl || '').replaceAll('"', '%22')}")`
        el('div', 'photo-grade', root)
        const sweep = el('div', 'sweep', root)
        tl.fromTo(
          photo,
          { scale: 1.04, y: 10 },
          { scale: 1.14, y: -26, duration: duration + 0.6, ease: 'none' },
          at,
        )
        /* The sweep crosses as the first headline word lands. */
        tl.fromTo(
          sweep,
          { x: -600, opacity: 0 },
          { x: 1700, opacity: 1, duration: 1, ease: 'power2.inOut' },
          at + BEATS.headline,
        )
        tl.to(sweep, { opacity: 0, duration: 0.3, ease: 'power1.out' }, at + BEATS.headline + 0.8)
      }

      const buildSignoff = (scene, root, at, duration) => {
        const block = el('div', 'signoff', root)
        const logo = el('img', 'signoff-logo', block)
        logo.src = 'assets/brand/christmas-logo.svg'
        logo.alt = ''
        const phone = el('div', 'phone', block)
        phone.textContent = scene.sub || ''
        const rule = el('div', 'rule', block)
        const cta = el('div', 'cta', block)
        cta.textContent = scene.headline || ''

        /* Logo pops, phone slams, rule draws, CTA settles — then the block breathes. */
        tl.fromTo(
          logo,
          { opacity: 0, scale: 0.6, y: 20 },
          { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: 'back.out(1.6)' },
          at + BEATS.signoffLogo,
        )
        tl.set(phone, { opacity: 1, y: 96 }, at + BEATS.signoffPhone)
        tl.to(phone, { y: 0, duration: 0.24, ease: 'power4.out' }, at + BEATS.signoffPhone)
        tl.fromTo(
          phone,
          { scale: 1.06 },
          { scale: 1, duration: 0.3, ease: 'power2.out' },
          at + BEATS.signoffPhone + 0.2,
        )
        tl.fromTo(
          rule,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.7, ease: 'power3.out' },
          at + BEATS.signoffPhone + 0.2,
        )
        tl.fromTo(
          cta,
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' },
          at + BEATS.signoffPhone + 0.45,
        )
        const breaths = Math.max(0, Math.floor((duration - 1.6) / 1.4))
        if (breaths > 0) {
          tl.to(
            block,
            { scale: 1.015, duration: 0.7, ease: 'sine.inOut', yoyo: true, repeat: breaths * 2 - 1 },
            at + 1.4,
          )
        }
      }

      // ── Lay the scenes out ───────────────────────────────────────────

      let cursor = 0
      for (const [index, scene] of scenes.entries()) {
        const duration = sceneDuration(scene)
        const root = el('div', 'scene', stage)
        root.id = `scene-${index + 1}`

        /* Art and words are separate layers that cut together. */
        const words = el('div', 'scene', copyLayer)
        words.id = `scene-${index + 1}-copy`

        if (scene.type === 'lights') {
          buildLights(scene, root, cursor, duration)
          animateCopy(copyBlock(scene, words, { top: true }), cursor)
        } else if (scene.type === 'photo') {
          buildPhoto(scene, root, cursor, duration)
          animateCopy(copyBlock(scene, words), cursor)
        } else if (scene.type === 'signoff') {
          buildSignoff(scene, words, cursor, duration)
        } else {
          animateCopy(copyBlock(scene, words, { center: true }), cursor)
        }

        /* Hard cuts, hidden under the light burst. The first scene opens under
           a long bloom — the hook — instead of a fade. */
        for (const layer of [root, words]) {
          tl.set(layer, { opacity: 1 }, cursor)
          if (index < scenes.length - 1) {
            tl.set(layer, { opacity: 0 }, cursor + duration)
          }
        }
        if (index > 0) {
          burst(cursor)
        }

        cursor += duration
      }

      /* The hook: the reel opens inside a bulb's bloom that clears to reveal scene one. */
      tl.fromTo(
        '#burst',
        { opacity: 1, scale: 1.3 },
        { opacity: 0, scale: 1, duration: BEATS.hook, ease: 'power3.out' },
        0,
      )

      window.__timelines = window.__timelines || {}
      window.__timelines['main'] = tl
      tl.seek(0)
    </script>
  </body>
</html>
