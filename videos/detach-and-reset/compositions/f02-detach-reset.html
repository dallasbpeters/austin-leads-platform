      <script>
        ;(function () {
          /* The teaching chart. Three bars on one scale: what the warranty
             promises, what Texas delivers, and how long the panels last. Each
             bar draws on the clause of the voiceover that names it. */
          const tl = gsap.timeline({ paused: true })
          const F = 1 / 60
          tl.fromTo(
            '#f02-root .eyebrow',
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' },
            0.22,
          )
          let t = 0.42
          document.querySelectorAll('#f02-root .head .w').forEach((el, i, a) => {
            const heavy = i === a.length - 1
            const d = heavy ? 0.28 : 0.22
            tl.set(el, { opacity: 1, y: heavy ? 88 : 54 }, t)
            tl.to(el, { y: 0, duration: d, ease: 'power4.out' }, t)
            t += d - F
          })

          const BEAT = [1.9, 4.5, 6.6] /* "thirty years" / "we see twenty" / "warranted for twenty five" */
          ;[1, 2, 3].forEach((n, i) => {
            const r = '#f02-root .r' + n + ' '
            const at = BEAT[i]
            tl.fromTo(
              r + '.name',
              { opacity: 0, x: -22 },
              { opacity: 1, x: 0, duration: 0.46, ease: 'power3.out' },
              at,
            )
            if (document.querySelector(r + '.ghost')) {
              tl.fromTo(r + '.ghost', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out' }, at)
            }
            tl.fromTo(
              r + '.fill',
              { scaleX: 0 },
              { scaleX: 1, duration: 0.86, ease: 'power3.out' },
              at + 0.12,
            )
            tl.fromTo(
              r + '.yrs',
              { opacity: 0, y: 14 },
              { opacity: 1, y: 0, duration: 0.44, ease: 'power3.out' },
              at + 0.6,
            )
          })
          tl.fromTo('#f02-root .fine', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 8.0)

          window.__timelines['f02'] = tl
        })()
      </script>
