      <script>
        ;(function () {
          /* Two scenes in one frame, cut at 4.6s on the voiceover's own comma.
             Scene A is the hook over live footage; scene B is the number that
             makes the hook true, drawn as the real chart from the guide data. */
          const tl = gsap.timeline({ paused: true })
          const F = 1 / 60

          tl.fromTo(
            '#f01-root .shot .inner',
            { scale: 1.1, xPercent: 1.5 },
            { scale: 1, xPercent: 0, duration: 4.8, ease: 'power3.out' },
            0,
          )
          tl.fromTo(
            '#f01-root .a .eyebrow',
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' },
            0.3,
          )
          tl.fromTo(
            '#f01-root .logo',
            { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.62, ease: 'power3.out' },
            0.4,
          )
          let t = 0.62
          document.querySelectorAll('#f01-root .a .head .w').forEach((el, i, a) => {
            const heavy = i === 2 || i === a.length - 1
            const d = heavy ? 0.26 : 0.2
            tl.set(el, { opacity: 1, y: heavy ? 84 : 52 }, t)
            tl.to(el, { y: 0, duration: d, ease: 'power4.out' }, t)
            t += d - F
          })

          /* Internal cut — the footage hands off to the data. */
          tl.fromTo('#f01-root .b', { opacity: 0 }, { opacity: 1, duration: 0.42, ease: 'power2.inOut' }, 4.6)
          tl.to('#f01-root .scene', { opacity: 0, duration: 0.34, ease: 'power2.inOut' }, 4.64)
          tl.fromTo(
            '#f01-root .b .eyebrow',
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' },
            4.78,
          )
          tl.fromTo(
            '#f01-root .b .title',
            { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.56, ease: 'power3.out' },
            4.92,
          )
          tl.fromTo('#f01-root .axis', { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: 'expo.out' }, 5.1)
          tl.fromTo(
            '#f01-root .bar .fill',
            { scaleY: 0 },
            { scaleY: 1, duration: 0.82, ease: 'power3.out', stagger: 0.1 },
            5.3,
          )
          tl.fromTo(
            '#f01-root .bar .lbl',
            { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out', stagger: 0.1 },
            5.42,
          )
          tl.fromTo(
            '#f01-root .bar .val',
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.42, ease: 'power3.out', stagger: 0.1 },
            5.72,
          )
          tl.fromTo('#f01-root .fine', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 7.2)

          window.__timelines['f01'] = tl
        })()
