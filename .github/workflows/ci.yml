# Runs Vitest on every PR and on pushes to the default branch.
# Require this workflow to pass before merging (branch protection), and in Vercel:
# Project → Settings → Git → enable “Wait for CI” / deployment checks so previews
# production deploys don’t ship when tests fail.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true



jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # JavaScript actions (checkout, pnpm/setup, etc.) — Node 20 is deprecated on runners.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        # Pin is only in package.json "packageManager"; duplicate version here causes ERR_PNPM_BAD_PM_VERSION.

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm test
