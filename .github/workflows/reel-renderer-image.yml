# Builds the reel renderer image and publishes it to GitHub's registry.
#
# Railway runs this finished image instead of building it, so a deploy is a
# pull (about a minute) and never waits on Railway's builders. Layers are
# cached here, so a code-only change rebuilds in a few minutes.
#
# Optional repo secret:
#   RAILWAY_TOKEN — a Railway project token. When set, Railway redeploys the
#                   renderer as soon as the new image is published. Without it,
#                   use "Redeploy renderer" on the Social accounts page.

name: Reel renderer image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reel-renderer-image.yml
      - .dockerignore
      - services/reel-renderer/**
      - videos/christmas-reels/**
      - scripts/sync-reel-assets.mjs
      - public/christmas-logo.svg
      - public/images/tx-christmas-logo.svg
      - public/images/tx-christmas-hero-collage.png
      - public/fonts/Switzer-Variable.woff2
      - public/fonts/BespokeSerif-Variable.woff2
      - public/christmas-mockup/**
      - public/reel-music/**
  workflow_dispatch:

concurrency:
  group: reel-renderer-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/reel-renderer

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/reel-renderer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy on Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "No RAILWAY_TOKEN secret; redeploy from the Social accounts page."
            exit 0
          fi
          gql() {
            curl -sS https://backboard.railway.com/graphql/v2 \
              -H "Content-Type: application/json" \
              -H "Project-Access-Token: $RAILWAY_TOKEN" \
              -d "$1"
          }
          target=$(gql '{"query":"query { projectToken { projectId environmentId } }"}')
          project=$(echo "$target" | jq -r '.data.projectToken.projectId')
          environment=$(echo "$target" | jq -r '.data.projectToken.environmentId')
          service=$(gql "{\"query\":\"query { project(id: \\\"$project\\\") { services { edges { node { id } } } } }\"}" \
            | jq -r '.data.project.services.edges[0].node.id')
          gql "{\"query\":\"mutation { serviceInstanceRedeploy(serviceId: \\\"$service\\\", environmentId: \\\"$environment\\\") }\"}"
