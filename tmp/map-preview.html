<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Service Area Map — Design Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --secondary:   #0F363E;
      --tertiary:    #F8981B;
      --text-soft:   #4D6A6F;
      --surface:     #ffffff;
      --neutral:     #EEF3F7;
      --rule:        rgba(15,54,62,0.10);
      --font-serif:  'Bodoni Moda', Georgia, serif;
      --font-sans:   'Figtree', system-ui, sans-serif;
    }

    body {
      font-family: var(--font-sans);
      background: var(--neutral);
      color: var(--secondary);
      -webkit-font-smoothing: antialiased;
    }

    .preview-label {
      text-align: center;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #aaa;
      padding: 16px;
    }

    /* ── Section ─────────────────────────────────────────── */
    .section {
      background: var(--secondary);
      border-bottom: 1px solid var(--rule);
      overflow: hidden;
    }

    /* ── Split layout ─────────────────────────────────────── */
    .split {
      display: grid;
      grid-template-columns: 380px 1fr;
      min-height: 480px;
    }

    /* ── Left panel ───────────────────────────────────────── */
    .panel {
      padding: 56px 40px 56px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid rgba(255,255,255,0.08);
    }

    .eyebrow {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--tertiary);
      margin-bottom: 16px;
    }

    .heading {
      font-family: var(--font-serif);
      font-size: clamp(1.75rem, 2.8vw, 2.25rem);
      font-weight: 800;
      line-height: 1.05;
      color: #ffffff;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    .description {
      font-size: 0.9375rem;
      line-height: 1.7;
      color: rgba(255,255,255,0.55);
      margin-bottom: 32px;
    }

    /* ── County chips ─────────────────────────────────────── */
    .chips-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.30);
      margin-bottom: 10px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      font-weight: 600;
      color: rgba(255,255,255,0.80);
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 4px 10px 4px 7px;
      line-height: 1;
    }

    .chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--tertiary);
      flex-shrink: 0;
    }

    /* ── Map placeholder ──────────────────────────────────── */
    .map-area {
      position: relative;
      background: #0d2b31;
      overflow: hidden;
    }

    /* Fake map grid lines */
    .map-area::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Texas shape placeholder */
    .map-shape {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-40%, -50%);
      width: 340px;
      height: 300px;
    }

    .map-label {
      position: absolute;
      bottom: 20px;
      right: 20px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
    }

    /* Zoom controls placeholder */
    .map-controls {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .map-ctrl-btn {
      width: 28px;
      height: 28px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Austin area highlight */
    .map-highlight {
      position: absolute;
      width: 110px;
      height: 90px;
      background: rgba(248,152,27,0.25);
      border: 1.5px solid rgba(248,152,27,0.7);
      border-radius: 3px;
      top: 50%;
      left: 50%;
      transform: translate(-35%, -55%);
    }

    .map-highlight-label {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.625rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--tertiary);
      white-space: nowrap;
    }

    /* Surrounding counties */
    .county-1 { position: absolute; width: 80px; height: 70px; background: rgba(248,152,27,0.12); border: 1px solid rgba(248,152,27,0.3); border-radius: 2px; top: 50%; left: 50%; transform: translate(-120%, -50%); }
    .county-2 { position: absolute; width: 70px; height: 80px; background: rgba(248,152,27,0.12); border: 1px solid rgba(248,152,27,0.3); border-radius: 2px; top: 50%; left: 50%; transform: translate(70%, -90%); }
    .county-3 { position: absolute; width: 90px; height: 65px; background: rgba(248,152,27,0.10); border: 1px solid rgba(248,152,27,0.25); border-radius: 2px; top: 50%; left: 50%; transform: translate(-30%, 30%); }
    .county-4 { position: absolute; width: 65px; height: 75px; background: rgba(248,152,27,0.10); border: 1px solid rgba(248,152,27,0.25); border-radius: 2px; top: 50%; left: 50%; transform: translate(-135%, 25%); }
  </style>
</head>
<body>

<div class="preview-label">Design Preview — ServiceAreaMapSection</div>

<section class="section">
  <div class="split">

    <!-- Left panel -->
    <div class="panel">
      <p class="eyebrow">Where we work</p>
      <h2 class="heading">Austin and surrounding areas</h2>
      <p class="description">We currently serve the greater Austin metro and surrounding communities within about 30 miles.</p>

      <p class="chips-label">Service counties</p>
      <div class="chips">
        <span class="chip"><span class="chip-dot"></span>Travis</span>
        <span class="chip"><span class="chip-dot"></span>Williamson</span>
        <span class="chip"><span class="chip-dot"></span>Hays</span>
        <span class="chip"><span class="chip-dot"></span>Bastrop</span>
        <span class="chip"><span class="chip-dot"></span>Caldwell</span>
      </div>
    </div>

    <!-- Right: map -->
    <div class="map-area">
      <div class="county-1"></div>
      <div class="county-2"></div>
      <div class="county-3"></div>
      <div class="county-4"></div>
      <div class="map-highlight">
        <span class="map-highlight-label">Austin metro</span>
      </div>

      <div class="map-controls">
        <div class="map-ctrl-btn">+</div>
        <div class="map-ctrl-btn">−</div>
      </div>

      <div class="map-label">© Mapbox · © OpenStreetMap</div>
    </div>

  </div>
</section>

<div class="preview-label">End of Preview</div>

</body>
</html>
