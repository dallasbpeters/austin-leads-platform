    <line x1="311" y1="117" x2="357" y2="117"/>
    <line x1="362" y1="117" x2="408" y2="117"/>
    <line x1="260" y1="147" x2="306" y2="147"/>
    <line x1="311" y1="147" x2="357" y2="147"/>
    <line x1="362" y1="147" x2="408" y2="147"/>
