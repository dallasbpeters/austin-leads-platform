  <!-- Legend -->
  <rect x="60" y="276" width="14" height="10" rx="1" fill="#4f7942"/>
  <text x="80" y="285" font-size="11" fill="#1d2733" font-weight="bold">Solar Panels (20 panels × 2 arrays)</text>

  <rect x="290" y="276" width="14" height="10" rx="1" fill="#d0d8e2" stroke="#16324f" stroke-width="1.5"/>
  <text x="310" y="285" font-size="11" fill="#1d2733" font-weight="bold">Roof Outline</text>

  <!-- North arrow -->
  <g transform="translate(486,58)">
    <circle r="16" fill="#16324f" opacity="0.9"/>
    <polygon points="0,-10 4,4 0,1 -4,4" fill="white"/>
    <text y="9" font-size="9" fill="white" text-anchor="middle" font-weight="bold">N</text>
